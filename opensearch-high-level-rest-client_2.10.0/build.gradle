// Build.gradle generated for instrumentation module opensearch-high-level-rest-client

apply plugin: 'java'

targetCompatibility=JavaVersion.VERSION_11

dependencies {
    implementation 'org.opensearch.client:opensearch-rest-high-level-client:2.10.0'
    implementation 'org.opensearch.client:opensearch-rest-client:2.10.0'

    // New Relic Java Agent dependencies
    implementation 'com.newrelic.agent.java:newrelic-agent:' + project.findProperty('java.agent.version')
    implementation 'com.newrelic.agent.java:newrelic-api:' + project.findProperty('java.agent.version')
    implementation 'com.newrelic.agent.java:agent-bridge:' + project.findProperty('java.agent.version')
    implementation fileTree(include: ['*.jar'], dir: '../test-lib')
}

jar {
    manifest {
        attributes 'Implementation-Title': 'com.newrelic.instrumentation.labs.opensearch-high-level-rest-client_2.10'
        attributes 'Implementation-Vendor': 'New Relic Labs'
        attributes 'Implementation-Vendor-Id': 'com.newrelic.labs'
        attributes 'Implementation-Version': 1.0
    }
}

verifyInstrumentation {
    passes 'org.opensearch.client:opensearch-rest-high-level-client:[2.10.0,3.0.0)'
    excludeRegex '.*alpha.*'
    excludeRegex '.*beta.*'
}